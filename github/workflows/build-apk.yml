name: Gerar APK

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependências
        run: npm install

      - name: Criar o projeto Android
        run: npx cap add android

      - name: Aplicar ícone, tela de abertura e Android 13 como mínimo
        run: |
          cp -r android-overrides/res/. android/app/src/main/res/
          sed -i 's/minSdkVersion = [0-9]*/minSdkVersion = 33/' android/variables.gradle
          grep -n "SdkVersion" android/variables.gradle

      - name: Copiar o app para o projeto Android
        run: npx cap sync android

      - name: Compilar o APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Renomear o APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Gestao-de-Ferias.apk

      - name: Guardar o APK na execução
        uses: actions/upload-artifact@v4
        with:
          name: Gestao-de-Ferias-apk
          path: Gestao-de-Ferias.apk

      - name: Publicar em Releases (para baixar direto no celular)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Gestão de Férias v${{ github.run_number }}
          body: |
            Para instalar, baixe o arquivo **Gestao-de-Ferias.apk** (em Assets, logo abaixo).
            Ignore "Source code (zip)" e "Source code (tar.gz)": são só o código do projeto, não o aplicativo.
          files: Gestao-de-Ferias.apk

      - name: Mostrar o link direto do APK
        run: |
          URL="https://github.com/${{ github.repository }}/releases/download/v${{ github.run_number }}/Gestao-de-Ferias.apk"
          echo "### APK pronto" >> "$GITHUB_STEP_SUMMARY"
          echo "Toque para baixar o arquivo .apk direto: [Gestao-de-Ferias.apk]($URL)" >> "$GITHUB_STEP_SUMMARY"
