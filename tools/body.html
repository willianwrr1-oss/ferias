<div class="app" id="app">
  <header class="top">
    <div class="mark" aria-hidden="true">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><rect x="3.5" y="5" width="17" height="15.5" rx="3" fill="#fff"/><path d="M3.5 8a3 3 0 0 1 3-3h11a3 3 0 0 1 3 3v2.2h-17z" fill="#F4B13D"/><path d="M8.2 17.2a3.8 3.8 0 0 1 7.6 0z" fill="#E0483C"/><path d="M12 13.4v6" stroke="#0A4E56" stroke-width="1.4" stroke-linecap="round"/></svg>
    </div>
    <div>
      <small id="top-small">Gestão de férias</small>
      <h1 id="top-title">Resumo</h1>
    </div>
  </header>
  <div class="demo" id="demo" hidden>
    <span>Simulação com dados de exemplo.</span>
    <button type="button" id="demo-reset">Restaurar exemplos</button>
  </div>

  <main id="main" tabindex="-1"></main>

  <button class="fab" id="fab" type="button" aria-label="Novo cadastro de férias">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    <span>Novo</span>
  </button>

  <nav aria-label="Seções do aplicativo">
    <button type="button" data-tab="resumo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="7" height="8" rx="2"/><rect x="13.5" y="3.5" width="7" height="5" rx="2"/><rect x="13.5" y="11.5" width="7" height="9" rx="2"/><rect x="3.5" y="14.5" width="7" height="6" rx="2"/></svg>
      Resumo
    </button>
    <button type="button" data-tab="cad">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6.5h12M8 12h12M8 17.5h12"/><circle cx="4" cy="6.5" r="1" fill="currentColor"/><circle cx="4" cy="12" r="1" fill="currentColor"/><circle cx="4" cy="17.5" r="1" fill="currentColor"/></svg>
      Cadastros
    </button>
    <button type="button" data-tab="cal">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
      Calendário
    </button>
    <button type="button" data-tab="exp">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3.5H7.5a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2h9a2 2 0 0 0 2-2V8z"/><path d="M14 3.5V8h4.5M12 11.5v5.2M9.8 14.7l2.2 2.2 2.2-2.2"/></svg>
      Exportar
    </button>
    <button type="button" data-tab="opt">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 14.6a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.6 1.6 0 0 0-1-1.5 1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.6 1.6 0 0 0 1.5-1 1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3h0a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5h0a1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8v0a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/></svg>
      Opções
    </button>
  </nav>

  <div class="toast" id="toast" hidden role="status"></div>

  <div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <header>
      <button type="button" class="iconbtn" id="sheet-close" aria-label="Fechar">&#10005;</button>
      <h2 id="sheet-title">Novo cadastro</h2>
    </header>
    <form id="form" novalidate>
      <label class="lb" for="f-nome">Nome do colaborador
        <input class="field" id="f-nome" autocomplete="off" maxlength="80">
        <span class="err" id="e-nome"></span>
      </label>
      <div class="row2">
        <label class="lb" for="f-mat"><span>Matrícula <span class="opt">(opcional)</span></span>
          <input class="field" id="f-mat" inputmode="numeric" maxlength="20" autocomplete="off">
        </label>
        <label class="lb" for="f-setor"><span>Setor</span>
          <input class="field" id="f-setor" list="setores" maxlength="40" autocomplete="off">
          <datalist id="setores"></datalist>
        </label>
      </div>
      <div class="row2">
        <label class="lb" for="f-ini">Início
          <span class="df"><input class="field" id="f-ini" inputmode="numeric" placeholder="dd/mm/aaaa" maxlength="10" autocomplete="off"><button type="button" class="df-btn" data-pick="f-ini" aria-label="Abrir calendário do início"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg></button></span>
          <span class="err" id="e-ini"></span>
        </label>
        <label class="lb" for="f-fim">Fim
          <span class="df"><input class="field" id="f-fim" inputmode="numeric" placeholder="dd/mm/aaaa" maxlength="10" autocomplete="off"><button type="button" class="df-btn" data-pick="f-fim" aria-label="Abrir calendário do fim"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg></button></span>
          <span class="err" id="e-fim"></span>
        </label>
      </div>
      <div class="calc" id="calc" hidden></div>
      <div id="hints" class="list"></div>
      <div class="lb" role="radiogroup" aria-label="Situação">Situação
        <div class="seg">
          <label><input type="radio" name="status" value="aprovada" checked><span>Aprovada</span></label>
          <label><input type="radio" name="status" value="pendente"><span>Pendente</span></label>
        </div>
      </div>
      <label class="lb" for="f-obs"><span>Observações <span class="opt">(opcional)</span></span>
        <textarea class="field" id="f-obs" maxlength="300"></textarea>
      </label>
      <div class="form-actions">
        <button type="submit" class="btn btn-primary">Salvar cadastro</button>
        <button type="button" class="btn btn-danger" id="btn-del" hidden>Excluir cadastro</button>
      </div>
    </form>
  </div>
  <div class="pk-wrap" id="pk" hidden>
    <div class="pk-back" data-pk-close="1"></div>
    <div class="pk" role="dialog" aria-modal="true" aria-label="Escolher data">
      <div class="pk-head">
        <button type="button" class="iconbtn" id="pk-prev" aria-label="Anterior">&#8249;</button>
        <div class="pk-title" id="pk-title"></div>
        <button type="button" class="iconbtn" id="pk-next" aria-label="Próximo">&#8250;</button>
      </div>
      <div class="pk-body" id="pk-body"></div>
      <div class="pk-foot">
        <button type="button" class="btn btn-ghost" id="pk-today">Hoje</button>
        <button type="button" class="btn btn-ghost" data-pk-close="1">Cancelar</button>
      </div>
    </div>
  </div>
</div>

<script src="__JSPDF__"></script>
<script>
(function () {
  'use strict';
  var DEMO = __DEMO__;
  var KEY = 'gestao-ferias.v1';
  var MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
  var DIAS = ['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'];
  var DOW = ['D','S','T','Q','Q','S','S'];
  var TITULOS = { resumo: 'Resumo', cad: 'Cadastros', cal: 'Calendário', exp: 'Exportar', opt: 'Opções' };
  var VERSION = '__VERSION__', BUILD_DATE = '__BUILD_DATE__';
  var DEV = { nome: 'Willian', contato: 'willian.wrr1@gmail.com' };
  var NOVIDADES = [
    'Datas: digite direto no campo (dd/mm/aaaa) ou abra o calendário e toque no mês ou no ano para pular rápido',
    'Backup automático em uma pasta do Android, com frequência à escolha',
    'Importação do banco de dados (substituir ou mesclar)',
    'Relatório em PDF e coluna de semanas no calendário'
  ];
  var KEY_PREV = 'gestao-ferias.antes-importacao';
  var STATUS_FILTRO = [['', 'Todas as situações'], ['pend', 'Pendente'], ['prog', 'Programada'], ['now', 'Em férias'], ['done', 'Concluída']];

  function $(s) { return document.querySelector(s); }
  function pad(n) { return String(n).padStart(2, '0'); }
  function iso(y, m, d) { return y + '-' + pad(m + 1) + '-' + pad(d); }
  function todayISO() { var d = new Date(); return iso(d.getFullYear(), d.getMonth(), d.getDate()); }
  function parts(s) { return s.split('-').map(Number); }
  function num(s) { var p = parts(s); return Date.UTC(p[0], p[1] - 1, p[2]) / 86400000; }
  function addDays(s, n) { var p = parts(s); var d = new Date(Date.UTC(p[0], p[1] - 1, p[2] + n)); return iso(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()); }
  function fmt(s) { var p = s.split('-'); return p[2] + '/' + p[1] + '/' + p[0]; }
  function fmtS(s) { var p = s.split('-'); return p[2] + '/' + p[1]; }
  function span(r) { return num(r.fim) - num(r.inicio) + 1; }
  function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function norm(s) { return String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase(); }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function plural(n, um, varios) { return n + ' ' + (n === 1 ? um : varios); }
  function byInicio(a, b) { return a.inicio.localeCompare(b.inicio); }

  /* ---------- dados ---------- */
  var data = [];
  var tab = 'resumo';
  var now0 = new Date();
  var view = { y: now0.getFullYear(), m: now0.getMonth() };
  var selected = null;
  var filter = { q: '', setor: '', status: '' };
  var editingId = null;
  var exp = { escopo: 'todos', de: '', ate: '', setor: '' };
  (function () {
    var n = new Date(), y = n.getFullYear(), m = n.getMonth();
    exp.de = iso(y, m, 1);
    exp.ate = iso(y, m, new Date(Date.UTC(y, m + 1, 0)).getUTCDate());
  })();

  function load() { try { var s = localStorage.getItem(KEY); if (s) return JSON.parse(s); } catch (e) {} return null; }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) {} syncNative(); }

  function seed() {
    var t = todayISO();
    function mk(nome, mat, setor, off, dias, status, obs) {
      return { id: uid(), nome: nome, matricula: mat, setor: setor, inicio: addDays(t, off), fim: addDays(t, off + dias - 1), status: status, obs: obs || '' };
    }
    return [
      mk('Marina Alves', '10482', 'Qualidade', -3, 14, 'aprovada'),
      mk('Rafael Souza', '10517', 'Produção', 9, 10, 'aprovada', 'Retorna na segunda-feira.'),
      mk('Bruno Teixeira', '10733', 'Produção', 12, 10, 'pendente'),
      mk('Camila Ferreira', '10269', 'Metrologia', 9, 15, 'pendente'),
      mk('Diego Rocha', '10655', 'Qualidade', 25, 5, 'pendente'),
      mk('Juliana Prado', '10391', 'Logística', 40, 15, 'aprovada'),
      mk('Patrícia Nunes', '10124', 'RH', 60, 20, 'aprovada'),
      mk('Thiago Mendes', '10808', 'Manutenção', -40, 10, 'aprovada')
    ];
  }

  function situacao(r) {
    if (r.status === 'pendente') return { k: 'pend', t: 'Pendente' };
    var t = todayISO();
    if (r.fim < t) return { k: 'done', t: 'Concluída' };
    if (r.inicio <= t) return { k: 'now', t: 'Em férias' };
    return { k: 'prog', t: 'Programada' };
  }

  function filtered() {
    var q = norm(filter.q.trim());
    return data.filter(function (r) {
      return (!filter.setor || r.setor === filter.setor) &&
        (!filter.status || situacao(r).k === filter.status) &&
        (!q || norm(r.nome + ' ' + (r.matricula || '')).indexOf(q) !== -1);
    });
  }
  function filtroAtivo() { return !!(filter.q.trim() || filter.setor || filter.status); }

  /* ---------- peças de tela ---------- */
  function cardHTML(r, opts) {
    opts = opts || {};
    var s = situacao(r);
    var meta = [];
    if (r.matricula) meta.push('Matrícula ' + esc(r.matricula));
    meta.push(esc(r.setor || 'Sem setor'));
    var extra = '';
    if (s.k === 'now') extra = ' · retorno em ' + fmtS(addDays(r.fim, 1));
    var h = '<article class="card">' +
      '<button type="button" class="card-open" data-edit="' + r.id + '">' +
      '<span class="card-head"><strong>' + esc(r.nome) + '</strong><span class="badge b-' + s.k + '">' + s.t + '</span></span>' +
      '<span class="meta">' + meta.join(' · ') + '</span>' +
      '<span class="period num"><b>' + fmt(r.inicio) + '</b> a <b>' + fmt(r.fim) + '</b></span>' +
      '<span class="days">' + plural(span(r), 'dia corrido', 'dias corridos') + extra + '</span>' +
      (r.obs ? '<span class="meta">' + esc(r.obs) + '</span>' : '') +
      '</button>';
    if (opts.approve && r.status === 'pendente') {
      h += '<div class="actions"><button type="button" class="btn btn-soft btn-sm" data-approve="' + r.id + '">Aprovar</button></div>';
    }
    return h + '</article>';
  }

  function listHTML(arr, opts, emptyTitle, emptyText) {
    if (!arr.length) return '<div class="empty"><b>' + emptyTitle + '</b>' + emptyText + '</div>';
    return '<div class="list">' + arr.map(function (r) { return cardHTML(r, opts); }).join('') + '</div>';
  }

  function filtersHTML() {
    var setores = Array.from(new Set(data.map(function (r) { return r.setor; }).filter(Boolean))).sort(function (a, b) { return a.localeCompare(b, 'pt-BR'); });
    if (filter.setor && setores.indexOf(filter.setor) === -1) filter.setor = '';
    var so = '<option value="">Todos os setores</option>' + setores.map(function (s) { return '<option value="' + esc(s) + '"' + (s === filter.setor ? ' selected' : '') + '>' + esc(s) + '</option>'; }).join('');
    var st = STATUS_FILTRO.map(function (o) { return '<option value="' + o[0] + '"' + (o[0] === filter.status ? ' selected' : '') + '>' + o[1] + '</option>'; }).join('');
    return '<div class="filters">' +
      '<input class="field q" id="q" type="search" placeholder="Buscar por nome ou matrícula" aria-label="Buscar por nome ou matrícula" value="' + esc(filter.q) + '" autocomplete="off">' +
      '<select class="field" id="fsetor" aria-label="Filtrar por setor">' + so + '</select>' +
      '<select class="field" id="fstatus" aria-label="Filtrar por situação">' + st + '</select>' +
      '</div><div class="filters-note" id="fnote"></div>';
  }

  function updateNote(shown) {
    var el = $('#fnote'); if (!el) return;
    el.innerHTML = filtroAtivo()
      ? '<span>Filtro ativo: ' + plural(shown, 'cadastro', 'cadastros') + ' de ' + data.length + '</span><button type="button" data-clear="1">Limpar filtros</button>'
      : '';
  }

  /* ---------- telas ---------- */
  function viewResumo() {
    var t = todayISO(), lim30 = addDays(t, 30), lim60 = addDays(t, 60);
    var ativos = data.filter(function (r) { return r.status === 'aprovada' && r.inicio <= t && t <= r.fim; }).sort(byInicio);
    var prox = data.filter(function (r) { return r.inicio > t && r.inicio <= lim60; }).sort(byInicio).slice(0, 5);
    var pend = data.filter(function (r) { return r.status === 'pendente'; }).sort(byInicio);
    var em30 = data.filter(function (r) { return r.inicio > t && r.inicio <= lim30; }).length;

    if (!data.length) {
      return '<section class="screen"><div class="empty"><b>Nenhum cadastro ainda</b>Toque em “Novo” para registrar as primeiras férias de um colaborador.</div></section>';
    }
    var nomes = ativos.map(function (r) { return r.nome; });
    var txt = !nomes.length ? 'Ninguém em férias hoje.' : (nomes.length > 3 ? nomes.slice(0, 3).join(', ') + ' e mais ' + (nomes.length - 3) : nomes.join(', '));
    return '<section class="screen">' +
      '<div class="hero"><h2>Em férias hoje</h2><div class="big num">' + ativos.length + '</div><div class="names">' + esc(txt) + '</div></div>' +
      '<div class="stats"><div class="stat"><b class="num">' + em30 + '</b><span>começam em 30 dias</span></div>' +
      '<div class="stat"><b class="num">' + pend.length + '</b><span>aguardando aprovação</span></div></div>' +
      '<div><div class="block-title"><h2>Próximas saídas</h2><span>até 60 dias</span></div>' +
      listHTML(prox, {}, 'Sem saídas previstas', 'Nenhuma férias começa nos próximos 60 dias.') + '</div>' +
      (pend.length ? '<div><div class="block-title"><h2>Para aprovar</h2><span>' + pend.length + '</span></div>' + listHTML(pend, { approve: true }, '', '') + '</div>' : '') +
      '</section>';
  }

  function rank(r) { return situacao(r).k === 'done' ? 1 : 0; }
  function resultsCad() {
    var arr = filtered().sort(function (a, b) {
      var ra = rank(a), rb = rank(b);
      if (ra !== rb) return ra - rb;
      return ra === 0 ? byInicio(a, b) : byInicio(b, a);
    });
    $('#results').innerHTML = (data.length
      ? listHTML(arr, { approve: true }, 'Nada encontrado', 'Nenhum cadastro combina com os filtros atuais.')
      : '<div class="empty"><b>Nenhum cadastro ainda</b>Toque em “Novo” para registrar as primeiras férias.</div>');
    updateNote(arr.length);
  }

  function calHTML(list) {
    var t = todayISO(), n0 = new Date();
    var isNow = view.y === n0.getFullYear() && view.m === n0.getMonth();
    var first = new Date(Date.UTC(view.y, view.m, 1)).getUTCDay();
    var dim = new Date(Date.UTC(view.y, view.m + 1, 0)).getUTCDate();
    function isoWeek(dt) {
      var x = new Date(Date.UTC(dt.getUTCFullYear(), dt.getUTCMonth(), dt.getUTCDate()));
      x.setUTCDate(x.getUTCDate() + 4 - (x.getUTCDay() || 7));
      var y0 = Date.UTC(x.getUTCFullYear(), 0, 1);
      return Math.ceil(((x.getTime() - y0) / 86400000 + 1) / 7);
    }
    var primeiro = iso(view.y, view.m, 1);
    function wkCell(r) {
      // a linha vai de domingo a sábado; a semana ISO é a da quinta-feira da linha
      var n = isoWeek(new Date(Date.UTC(view.y, view.m, 1 - first + 7 * r + 4)));
      var ini = addDays(primeiro, 7 * r - first), fim = addDays(ini, 6);
      return '<span class="wk' + (ini <= t && t <= fim ? ' now' : '') + '" aria-label="Semana ' + n + '">' + n + '</span>';
    }
    var cells = '<span class="dow wk" aria-hidden="true">Sem</span>' + DOW.map(function (d) { return '<span class="dow" aria-hidden="true">' + d + '</span>'; }).join('');
    if (first > 0) cells += wkCell(0);
    for (var i = 0; i < first; i++) cells += '<span class="day out"></span>';
    for (var d = 1; d <= dim; d++) {
      if ((first + d - 1) % 7 === 0) cells += wkCell((first + d - 1) / 7);
      var s = iso(view.y, view.m, d);
      var n = list.filter(function (r) { return r.inicio <= s && s <= r.fim; }).length;
      var dw = (first + d - 1) % 7;
      var cls = 'day' + (n ? ' has' : '') + (s === t ? ' today' : '') + (s === selected ? ' sel' : '') + ((dw === 0 || dw === 6) ? ' we' : '');
      cells += '<button type="button" class="' + cls + '" data-day="' + s + '" aria-label="' + d + ' de ' + MESES[view.m] + (n ? ', ' + plural(n, 'colaborador', 'colaboradores') + ' de férias' : '') + '"' + (s === selected ? ' aria-pressed="true"' : '') + '>' + d + '<span class="dot"></span></button>';
    }
    for (var pos = first + dim; pos % 7; pos++) cells += '<span class="day out"></span>';
    return '<div class="cal' + (isNow ? ' is-now' : '') + '">' +
      '<div class="cal-head">' +
      '<button type="button" class="iconbtn" data-nav="-1" aria-label="Mês anterior">&#8249;</button>' +
      '<h2>' + (isNow ? '<span class="tag">Mês atual</span>' : '') + cap(MESES[view.m]) + ' de ' + view.y + '</h2>' +
      '<button type="button" class="today-btn" data-today="1">Hoje</button>' +
      '<button type="button" class="iconbtn" data-nav="1" aria-label="Próximo mês">&#8250;</button>' +
      '</div><div class="cal-grid">' + cells + '</div></div>' +
      '<div class="legend"><span><i></i>Dia com férias cadastradas</span><span><em></em>Hoje</span><span>Sem: semana do ano</span></div>';
  }

  function resultsCal() {
    var list = filtered();
    var h = calHTML(list), arr, title, sub;
    if (selected) {
      arr = list.filter(function (r) { return r.inicio <= selected && selected <= r.fim; }).sort(byInicio);
      var p = parts(selected);
      title = cap(DIAS[new Date(Date.UTC(p[0], p[1] - 1, p[2])).getUTCDay()]) + ', ' + p[2] + ' de ' + MESES[p[1] - 1];

  /* ---------- PDF ---------- */
  function buildPdf(JsPDF, recs, info) {
    var doc = new JsPDF({ unit: 'mm', format: 'a4', orientation: 'portrait' });
    var W = 210, H = 297, M = 14, CW = W - 2 * M;
    var TEAL = [11, 107, 117], SUN = [244, 177, 61], INK = [16, 40, 44], MUT = [88, 111, 115], LINE = [217, 227, 228], ZEB = [244, 248, 248];
    var BADGE = { pend: [[251, 235, 201], [122, 77, 0]], prog: [[220, 238, 240], TEAL], now: [[220, 240, 229], [43, 122, 87]], done: [[230, 237, 238], [94, 116, 120]] };
    function fill(c) { doc.setFillColor(c[0], c[1], c[2]); }
    function draw(c) { doc.setDrawColor(c[0], c[1], c[2]); }
    function font(sz, st, c) { doc.setFontSize(sz); doc.setFont('helvetica', st || 'normal'); doc.setTextColor(c[0], c[1], c[2]); }
    function fit(t, w) {
      t = String(t);
      if (doc.getTextWidth(t) <= w) return t;
      while (t.length > 1 && doc.getTextWidth(t + '...') > w) t = t.slice(0, -1);
      return t + '...';
    }
    function dh(d) { return pad(d.getDate()) + '/' + pad(d.getMonth() + 1) + '/' + d.getFullYear() + ' às ' + pad(d.getHours()) + ':' + pad(d.getMinutes()); }

    /* cabeçalho */
    fill(TEAL); doc.rect(0, 0, W, 31, 'F');
    fill(SUN); doc.rect(0, 31, W, 1.6, 'F');
    font(19, 'bold', [255, 255, 255]); doc.text('Relatório de Férias', M, 14);
    font(10, 'normal', [255, 255, 255]); doc.text('Colaboradores', M, 20.5);
    font(9, 'bold', [255, 255, 255]); doc.text(info.periodo, W - M, 13, { align: 'right' });
    font(9, 'normal', [255, 255, 255]);
    doc.text(info.setor, W - M, 18.5, { align: 'right' });
    doc.text('Gerado em ' + dh(info.geradoEm), W - M, 24, { align: 'right' });

    /* indicadores */
    var st = stats(recs), y = 41, bw = (CW - 3 * 4) / 4;
    [['Cadastros', st.n], ['Dias de férias', st.dias], ['Aprovadas', st.ap], ['Pendentes', st.pe]].forEach(function (k, i) {
      var x = M + i * (bw + 4);
      fill([255, 255, 255]); draw(LINE); doc.setLineWidth(0.3); doc.roundedRect(x, y, bw, 18, 2, 2, 'FD');
      font(17, 'bold', k[0] === 'Pendentes' && k[1] ? [150, 95, 0] : TEAL); doc.text(String(k[1]), x + 4, y + 9.5);
      font(8, 'normal', MUT); doc.text(k[0], x + 4, y + 14.8);
    });
    y += 28;

    /* resumo por setor */
    var porSetor = {};
    recs.forEach(function (r) { var k = r.setor || 'Sem setor'; (porSetor[k] = porSetor[k] || { n: 0, d: 0 }); porSetor[k].n++; porSetor[k].d += span(r); });
    var nomesSetor = Object.keys(porSetor).sort(function (a, b) { return a.localeCompare(b, 'pt-BR'); });
    if (nomesSetor.length > 1) {
      font(11, 'bold', INK); doc.text('Resumo por setor', M, y); y += 3.5;
      fill(ZEB); doc.rect(M, y, CW, 7, 'F');
      font(8, 'bold', MUT); doc.text('SETOR', M + 3, y + 4.7); doc.text('CADASTROS', M + 112, y + 4.7, { align: 'right' }); doc.text('DIAS DE FÉRIAS', W - M - 3, y + 4.7, { align: 'right' });
      y += 7;
      nomesSetor.forEach(function (s) {
        if (y > H - 40) { doc.addPage(); y = 20; }
        font(9.5, 'normal', INK); doc.text(fit(s, 90), M + 3, y + 5);
        doc.text(String(porSetor[s].n), M + 112, y + 5, { align: 'right' });
        doc.text(String(porSetor[s].d), W - M - 3, y + 5, { align: 'right' });
        draw(LINE); doc.setLineWidth(0.2); doc.line(M, y + 7, W - M, y + 7);
        y += 7;
      });
      y += 9;
    }

    /* tabela principal */
    var cols = [['COLABORADOR', 50], ['SETOR', 30], ['INÍCIO', 21], ['FIM', 21], ['DIAS', 12], ['RETORNO', 21], ['SITUAÇÃO', 27]];
    function cabecalhoTabela() {
      fill(TEAL); doc.rect(M, y, CW, 8, 'F');
      font(7.8, 'bold', [255, 255, 255]);
      var x = M;
      cols.forEach(function (c, i) { doc.text(c[0], i === 4 ? x + c[1] - 2 : x + 2.5, y + 5.3, i === 4 ? { align: 'right' } : {}); x += c[1]; });
      y += 8;
    }
    if (y > H - 50) { doc.addPage(); y = 20; }
    font(11, 'bold', INK); doc.text('Cadastros', M, y); y += 3.5;
    cabecalhoTabela();
    var RH = 11.5;
    recs.forEach(function (r, i) {
      if (y + RH > H - 22) { doc.addPage(); y = 20; cabecalhoTabela(); }
      if (i % 2 === 1) { fill(ZEB); doc.rect(M, y, CW, RH, 'F'); }
      var x = M, s = situacao(r);
      font(9.5, 'bold', INK); doc.text(fit(r.nome, cols[0][1] - 4), x + 2.5, y + 4.9);
      font(7.5, 'normal', MUT); doc.text(r.matricula ? 'Matrícula ' + r.matricula : 'Sem matrícula', x + 2.5, y + 9);
      x += cols[0][1];
      font(9, 'normal', INK); doc.text(fit(r.setor || 'Sem setor', cols[1][1] - 4), x + 2.5, y + 6.9); x += cols[1][1];
      doc.text(fmt(r.inicio), x + 2.5, y + 6.9); x += cols[2][1];
      doc.text(fmt(r.fim), x + 2.5, y + 6.9); x += cols[3][1];
      doc.text(String(span(r)), x + cols[4][1] - 2, y + 6.9, { align: 'right' }); x += cols[4][1];
      doc.text(fmt(addDays(r.fim, 1)), x + 2.5, y + 6.9); x += cols[5][1];
      font(7.8, 'bold', BADGE[s.k][1]);
      var bwid = doc.getTextWidth(s.t) + 5;
      fill(BADGE[s.k][0]); doc.roundedRect(x + 1.5, y + 3.2, bwid, 5.2, 2.4, 2.4, 'F');
      font(7.8, 'bold', BADGE[s.k][1]); doc.text(s.t, x + 4, y + 6.9);
      draw(LINE); doc.setLineWidth(0.15); doc.line(M, y + RH, W - M, y + RH);
      y += RH;
    });

    /* rodapé em todas as páginas */
    var total = doc.getNumberOfPages();
    for (var p = 1; p <= total; p++) {
      doc.setPage(p);
      draw(LINE); doc.setLineWidth(0.3); doc.line(M, H - 14, W - M, H - 14);
      font(8, 'normal', MUT);
      doc.text('Gestão de Férias  |  Relatório de férias dos colaboradores', M, H - 9);
      doc.text('Página ' + p + ' de ' + total, W - M, H - 9, { align: 'right' });
    }
    return doc;
  }

  function nomeArquivo() {

  function entregarPdf(doc, nome) {

      var b64 = doc.output('datauristring').split(',')[1];

        return Cap.Plugins.Share.share({ title: 'Relatório de férias', url: res.uri, dialogTitle: 'Salvar ou enviar o PDF' });

  function gerarPdf() {
    var recs = expRecords();
    if (!recs.length) return;
    var J = window.jspdf && window.jspdf.jsPDF;

    setTimeout(function () {
      var fim = function () { var b = $('#btn-gerar'); if (b) { b.disabled = false; b.textContent = 'Gerar PDF (A4, retrato)'; } };
      try {
        var doc = buildPdf(J, recs, expInfo());
        entregarPdf(doc, nomeArquivo()).then(function () { toast(DEMO ? 'PDF gerado (download bloqueado na simulação)' : 'PDF pronto'); fim(); }, function (err) {
          var m = String(err && (err.message || err)).toLowerCase();

  }

  /* ---------- opções: backup, importação e sobre ---------- */
  function mockBackup() {
    var K = 'gestao-ferias.mock';
    function base() { return { hasFolder: false, folder: '', enabled: false, hours: 12, lastTime: 0, lastOk: true, lastMsg: '' }; }
    function get() { try { return Object.assign(base(), JSON.parse(localStorage.getItem(K) || '{}')); } catch (e) { return base(); } }
    function put(o) { try { localStorage.setItem(K, JSON.stringify(o)); } catch (e) {} return o; }
    return {
      status: function () { return Promise.resolve(get()); },
      pickFolder: function () { var o = get(); o.hasFolder = true; o.folder = 'Armazenamento interno/Documents/Backup Férias (simulado)'; return Promise.resolve(put(o)); },
      configure: function (a) { var o = get(); o.enabled = !!a.enabled; o.hours = a.hours || 12; return Promise.resolve(put(o)); },
      syncData: function () { return Promise.resolve(); },
      backupNow: function () { var o = get(); o.lastTime = Date.now(); o.lastOk = true; o.lastMsg = ''; return Promise.resolve(put(o)); }
    };
  }

  var Cap = window.Capacitor;
  var nativeBk = (Cap && Cap.isNativePlatform && Cap.isNativePlatform() && Cap.Plugins && Cap.Plugins.Backup) || null;
  var bridge = nativeBk || (DEMO ? mockBackup() : null);
  var bk = { hasFolder: false, folder: '', enabled: false, hours: 12, lastTime: 0, lastOk: true, lastMsg: '', busy: false };
  var imp = null;
  var FREQ = [[6, 'A cada 6 horas'], [12, 'A cada 12 horas'], [24, 'Todos os dias'], [168, 'Toda semana']];

  }

    }).catch(function () {});

    return bridge.backupNow({ json: backupJSON() }).then(function (s) {

  function entregarTexto(nome, texto) {
    var C = window.Capacitor;

      return C.Plugins.Filesystem.writeFile({ path: nome, data: texto, directory: 'CACHE', encoding: 'utf8' }).then(function (res) {
        return C.Plugins.Share.share({ title: 'Backup de férias', url: res.uri, dialogTitle: 'Salvar ou enviar o backup' });

  function validISO(s) {
    if (typeof s !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(s)) return false;
    var p = parts(s), d = new Date(Date.UTC(p[0], p[1] - 1, p[2]));
    return d.getUTCFullYear() === p[0] && d.getUTCMonth() === p[1] - 1 && d.getUTCDate() === p[2];
  }

  function impParse(obj, nome) {
    var lista = Array.isArray(obj) ? obj : (obj && Array.isArray(obj.registros) ? obj.registros : null);
    if (!lista) throw new Error('formato');
    var ok = [], skip = 0, ids = {};
    lista.forEach(function (r) {
      if (!r || typeof r !== 'object' || !String(r.nome || '').trim() || !validISO(r.inicio) || !validISO(r.fim) || r.fim < r.inicio) { skip++; return; }
      var id = r.id ? String(r.id).slice(0, 40) : uid();
      if (ids[id]) id = uid();
      ids[id] = 1;
      ok.push({
        id: id, nome: String(r.nome).trim().slice(0, 80), matricula: String(r.matricula || '').slice(0, 20),
        setor: String(r.setor || '').slice(0, 40), inicio: r.inicio, fim: r.fim,
        status: r.status === 'pendente' ? 'pendente' : 'aprovada', obs: String(r.obs || '').slice(0, 300)
      });
    });
    if (!ok.length) throw new Error('vazio');
    return { registros: ok, skipped: skip, geradoEm: (obj && obj.exportadoEm) || '', arquivo: nome || '', modo: 'substituir' };
  }

  function impRead(file) {
    var rd = new FileReader();
    rd.onload = function () {
      try { imp = impParse(JSON.parse(String(rd.result)), file.name); }
      catch (e) { imp = null; toast('Arquivo inválido. Escolha um backup .json deste app.'); }
      renderOpt();
    };
    rd.onerror = function () { toast('Não foi possível ler o arquivo.'); };
    rd.readAsText(file);
  }

  function impApply() {
    if (!imp) return;
    try { localStorage.setItem(KEY_PREV, JSON.stringify({ em: new Date().toISOString(), registros: data })); } catch (e) {}
    if (imp.modo === 'mesclar') {
      var chave = function (r) { return norm(r.nome) + '|' + r.inicio + '|' + r.fim; };
      var ids = {}, chaves = {};
      data.forEach(function (r) { ids[r.id] = 1; chaves[chave(r)] = 1; });
      imp.registros.forEach(function (r) {
        if (ids[r.id]) { data = data.map(function (x) { return x.id === r.id ? r : x; }); return; }
        if (chaves[chave(r)]) return;
        data.push(r); ids[r.id] = 1; chaves[chave(r)] = 1;
      });
    } else {
      data = imp.registros.slice();
    }
    save();
    var n = imp.registros.length;
    imp = null;
    filter = { q: '', setor: '', status: '' };
    toast('Importação concluída: ' + plural(n, 'cadastro', 'cadastros') + ' no arquivo');
    renderScreen();
  }

  function impUndo() {
    try {
      var prev = JSON.parse(localStorage.getItem(KEY_PREV) || 'null');
      if (!prev || !Array.isArray(prev.registros)) return;
      data = prev.registros; localStorage.removeItem(KEY_PREV);
      save(); toast('Importação desfeita'); renderScreen();
    } catch (e) { toast('Não foi possível desfazer.'); }
  }

  function temAnterior() { try { return !!localStorage.getItem(KEY_PREV); } catch (e) { return false; } }

  function viewOpcoes() {
    var h = '<section class="screen">';

    /* backup automático */
    h += '<div class="opt-card"><div class="opt-head"><h2>Backup automático</h2>' +
      '<label class="sw" aria-label="Backup automático"><input type="checkbox" id="bk-on" role="switch"' + (bk.enabled ? ' checked' : '') + (bridge ? '' : ' disabled') + '><span></span></label></div>';
    if (!bridge) {
      h += '<p class="meta" style="margin:0">Disponível só no aplicativo Android instalado. Aqui você ainda pode importar e copiar o banco de dados.</p>';
    } else {
      h += '<p class="meta" style="margin:0">Grava um arquivo de backup na pasta escolhida, na frequência abaixo, mesmo com o app fechado. Mantém as 10 cópias mais recentes.</p>' +
        '<div class="kv1"><span class="k">Pasta de destino</span><span class="v">' + (bk.hasFolder ? esc(bk.folder) : 'Nenhuma pasta escolhida') + '</span></div>' +
        '<button type="button" class="btn btn-soft" data-bk-pick="1">' + (bk.hasFolder ? 'Trocar pasta' : 'Escolher pasta') + '</button>' +
        '<label class="lb" for="bk-freq">Frequência<select class="field" id="bk-freq">' +
        FREQ.map(function (f) { return '<option value="' + f[0] + '"' + (f[0] === bk.hours ? ' selected' : '') + '>' + f[1] + '</option>'; }).join('') + '</select></label>' +
        '<div class="hint" style="background:var(--brand-soft);color:var(--ink)">Dica: crie uma pasta nova (por exemplo, Documentos &gt; Backup Férias). O Android não deixa escolher a raiz do armazenamento nem a pasta Download.</div>' +
        '<p class="bk-status ' + (bk.lastTime && !bk.lastOk ? 'err' : '') + '">' +
        (bk.lastTime ? 'Última cópia: ' + fmtDH(bk.lastTime) + (bk.lastOk ? ' (concluída)' : ' (falhou: ' + esc(bk.lastMsg) + ')') : 'Nenhuma cópia feita ainda.') + '</p>' +
        '<button type="button" class="btn btn-primary" data-bk-now="1"' + (bk.busy ? ' disabled' : '') + '>' + (bk.busy ? 'Salvando...' : 'Fazer backup agora') + '</button>';
    }
    h += '</div>';

    /* cópia e importação */
    h += '<div class="opt-card"><h2>Banco de dados</h2>' +
      '<p class="meta" style="margin:0">' + plural(data.length, 'cadastro guardado', 'cadastros guardados') + ' neste aparelho.</p>' +
      '<button type="button" class="btn btn-soft" data-share-json="1">Gerar cópia do banco (.json)</button>' +
      '<div class="sep"></div><h3>Importar banco de dados</h3>';
    if (!imp) {
      h += '<p class="meta" style="margin:0">Escolha um arquivo de backup (.json) gerado por este app.</p>' +
        '<label class="btn btn-primary btn-file" for="imp-file">Escolher arquivo de backup</label><input type="file" id="imp-file" class="vh">';
    } else {
      h += '<div class="imp-prev"><b>' + esc(imp.arquivo || 'Arquivo de backup') + '</b><span>' + plural(imp.registros.length, 'cadastro válido', 'cadastros válidos') +
        (imp.skipped ? ', ' + plural(imp.skipped, 'ignorado por dados inválidos', 'ignorados por dados inválidos') : '') +
        (imp.geradoEm ? '. Gerado em ' + fmtDH(Date.parse(imp.geradoEm) || Date.now()) : '') + '.</span></div>' +
        '<div class="lb" role="radiogroup" aria-label="Como importar">Como importar<div class="seg">' +
        '<label><input type="radio" name="impmode" value="substituir"' + (imp.modo === 'substituir' ? ' checked' : '') + '><span>Substituir tudo</span></label>' +
        '<label><input type="radio" name="impmode" value="mesclar"' + (imp.modo === 'mesclar' ? ' checked' : '') + '><span>Mesclar</span></label></div></div>' +
        '<p class="meta" style="margin:0">' + (imp.modo === 'substituir'
          ? 'Os ' + plural(data.length, 'cadastro atual', 'cadastros atuais') + ' serão trocados pelos do arquivo. Dá para desfazer logo depois.'
          : 'Os cadastros do arquivo são somados aos atuais. Repetidos (mesmo colaborador e período) não são duplicados.') + '</p>' +
        '<div class="actions"><button type="button" class="btn btn-primary" data-imp-go="1">Importar</button><button type="button" class="btn btn-ghost" data-imp-cancel="1">Cancelar</button></div>';
    }
    if (temAnterior()) h += '<button type="button" class="btn btn-ghost btn-sm" data-imp-undo="1">Desfazer última importação</button>';
    h += '</div>';

    /* sobre */
    h += '<div class="opt-card"><h2>Sobre o aplicativo</h2><dl class="kv">' +
      '<div><dt>Aplicativo</dt><dd>Gestão de Férias</dd></div>' +
      '<div><dt>Versão atual</dt><dd class="num">' + esc(VERSION) + '</dd></div>' +
      '<div><dt>Última atualização</dt><dd class="num">' + esc(BUILD_DATE) + '</dd></div>' +
      '<div><dt>Compatível com</dt><dd>Android 13 ou superior</dd></div>' +
      '<div><dt>Desenvolvedor</dt><dd>' + esc(DEV.nome) + '</dd></div>' +
      '<div><dt>Contato</dt><dd>' + esc(DEV.contato) + '</dd></div></dl>' +
      '<h3>Novidades desta versão</h3><ul class="news">' + NOVIDADES.map(function (n) { return '<li>' + esc(n) + '</li>'; }).join('') + '</ul></div>';

    return h + '</section>';
  }

  window.GestaoFerias = { buildPdf: buildPdf, impParse: impParse };

  function renderScreen() {
    var main = $('#main');
    document.querySelectorAll('nav button').forEach(function (b) {
      if (b.dataset.tab === tab) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
    });
    $('#top-title').textContent = TITULOS[tab];
    var n = new Date();
    $('#top-small').textContent = tab === 'resumo' ? cap(DIAS[n.getDay()]) + ', ' + n.getDate() + ' de ' + MESES[n.getMonth()] : 'Gestão de férias';
    if (tab === 'resumo') main.innerHTML = viewResumo();
    else if (tab === 'exp') main.innerHTML = viewExport();
    else if (tab === 'opt') main.innerHTML = viewOpcoes();
    else main.innerHTML = '<section class="screen">' + filtersHTML() + '<div id="results" class="screen"></div></section>';
    renderResults();
  }

  function go(t) { tab = t; renderScreen(); $('#main').scrollTop = 0; if (t === 'opt') refreshBk(); }

  /* ---------- campo de data (digitar ou escolher no calendário) ---------- */
  var CAL_ICON = '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>';
  function dateField(id, value) {
    return '<span class="df"><input class="field" id="' + id + '" inputmode="numeric" placeholder="dd/mm/aaaa" maxlength="10" autocomplete="off" value="' + (value ? fmt(value) : '') + '">' +
      '<button type="button" class="df-btn" data-pick="' + id + '" aria-label="Abrir calendário">' + CAL_ICON + '</button></span>';
  }
  function maskDate(v) {
    var d = String(v).replace(/\D/g, '').slice(0, 8), o = d.slice(0, 2);
    if (d.length > 2) o += '/' + d.slice(2, 4);
    if (d.length > 4) o += '/' + d.slice(4);
    return o;
  }
  function parseBR(t) {
    var m = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec(String(t).trim());
    if (!m) return '';
    var d = +m[1], mo = +m[2], y = +m[3];
    if (y < 1990 || y > 2100 || mo < 1 || mo > 12 || d < 1) return '';
    if (d > new Date(Date.UTC(y, mo, 0)).getUTCDate()) return '';
    return iso(y, mo - 1, d);
  }
  function getDate(id) { return parseBR($('#' + id).value); }
  function setDate(id, isoStr) { $('#' + id).value = isoStr ? fmt(isoStr) : ''; }

  var pk = { id: null, mode: 'day', y: 0, m: 0, base: 0, sel: '' };
  function pkOpen(id) {
    var cur = getDate(id), ref = cur;
    if (!ref && id === 'f-fim') ref = getDate('f-ini');
    if (!ref && id === 'xate') ref = getDate('xde');
    var p = parts(ref || todayISO());
    pk = { id: id, mode: 'day', y: p[0], m: p[1] - 1, base: 0, sel: cur };
    pkRender();
    $('#pk').hidden = false;
    try { $('#pk-title').querySelector('button').focus(); } catch (e) {}
  }
  function pkClose() { $('#pk').hidden = true; pk.id = null; }
  function pkPick(isoStr) {
    var el = $('#' + pk.id);
    el.value = fmt(isoStr);
    el.dispatchEvent(new Event('input', { bubbles: true }));
    pkClose();
  }
  function pkRender() {
    var title = $('#pk-title'), body = $('#pk-body'), h = '';
    if (pk.mode === 'day') {
      title.innerHTML = '<button type="button" class="pk-t" data-pk-mode="month">' + MESES[pk.m] + ' <i>&#9662;</i></button><button type="button" class="pk-t" data-pk-mode="year">' + pk.y + ' <i>&#9662;</i></button>';
      h = '<div class="pk-dow">' + DOW.map(function (d) { return '<span>' + d + '</span>'; }).join('') + '</div><div class="pk-days">';
      var first = new Date(Date.UTC(pk.y, pk.m, 1)).getUTCDay(), n = new Date(Date.UTC(pk.y, pk.m + 1, 0)).getUTCDate(), hoje = todayISO();
      for (var i = 0; i < first; i++) h += '<span></span>';
      for (var d = 1; d <= n; d++) {
        var s = iso(pk.y, pk.m, d);
        h += '<button type="button" class="pk-d' + (s === hoje ? ' is-today' : '') + (s === pk.sel ? ' is-sel' : '') + '" data-pk-day="' + s + '">' + d + '</button>';
      }
      h += '</div>';
    } else if (pk.mode === 'month') {
      title.innerHTML = '<button type="button" class="pk-t" data-pk-mode="year">' + pk.y + ' <i>&#9662;</i></button>';
      h = '<div class="pk-grid">' + MESES.map(function (nm, i) {
        return '<button type="button" class="pk-c' + (i === pk.m ? ' is-sel' : '') + '" data-pk-m="' + i + '">' + nm.slice(0, 3) + '</button>';
      }).join('') + '</div>';
    } else {
      var ini = pk.base;
      title.innerHTML = '<span class="pk-t">' + ini + ' – ' + (ini + 11) + '</span>';
      h = '<div class="pk-grid">';
      for (var y = ini; y < ini + 12; y++) h += '<button type="button" class="pk-c' + (y === pk.y ? ' is-sel' : '') + '" data-pk-y="' + y + '">' + y + '</button>';
      h += '</div>';
    }
    body.innerHTML = h;
  }
  function pkStep(dir) {
    if (pk.mode === 'day') { pk.m += dir; if (pk.m < 0) { pk.m = 11; pk.y--; } else if (pk.m > 11) { pk.m = 0; pk.y++; } }
    else if (pk.mode === 'month') pk.y += dir;
    else pk.base += dir * 12;
    pkRender();
  }
  function pkBind() {
    document.addEventListener('click', function (e) {
      var b = e.target.closest('[data-pick]');
      if (b) { e.preventDefault(); return pkOpen(b.dataset.pick); }
      if (!pk.id) return;
      var t = e.target.closest('[data-pk-close],[data-pk-mode],[data-pk-day],[data-pk-m],[data-pk-y]');
      if (!t) return;
      if (t.dataset.pkClose) return pkClose();
      if (t.dataset.pkDay) return pkPick(t.dataset.pkDay);
      if (t.dataset.pkMode) { pk.mode = t.dataset.pkMode; if (pk.mode === 'year') pk.base = pk.y - 4; return pkRender(); }
      if (t.dataset.pkM) { pk.m = Number(t.dataset.pkM); pk.mode = 'day'; return pkRender(); }
      if (t.dataset.pkY) { pk.y = Number(t.dataset.pkY); pk.mode = 'month'; return pkRender(); }
    });
    $('#pk-prev').addEventListener('click', function () { pkStep(-1); });
    $('#pk-next').addEventListener('click', function () { pkStep(1); });
    $('#pk-today').addEventListener('click', function () { pkPick(todayISO()); });
    document.addEventListener('input', function (e) {
      var t = e.target;
      if (!t.classList || !t.classList.contains('field') || !t.parentNode.classList.contains('df')) return;
      var m = maskDate(t.value); if (m !== t.value) t.value = m;
      if (t.id === 'xde') { exp.de = getDate('xde'); t.classList.toggle('bad', t.value.length === 10 && !exp.de); renderExpRes(); }
      if (t.id === 'xate') { exp.ate = getDate('xate'); t.classList.toggle('bad', t.value.length === 10 && !exp.ate); renderExpRes(); }
}, true);
  }

  /* ---------- formulário ---------- */
  function setErr(id, msg) { var e = $('#e-' + id); if (e) e.textContent = msg || ''; var f = $('#f-' + (id === 'nome' ? 'nome' : id)); if (f) f.classList.toggle('bad', !!msg); }

  function updateCalc() {
    var a = getDate('f-ini'), b = getDate('f-fim'), calc = $('#calc'), hints = [];
    if (!a || !b || b < a) { calc.hidden = true; $('#hints').innerHTML = ''; return; }
    var dias = num(b) - num(a) + 1;
    var ret = addDays(b, 1);
    calc.hidden = false;
    calc.innerHTML = '<span class="num">' + plural(dias, 'dia corrido', 'dias corridos') + '</span><small>retorno em ' + fmt(ret) + '</small>';
    if (dias > 30) hints.push('Passa de 30 dias corridos, que é o limite de férias por período aquisitivo.');
    if (dias < 5) hints.push('Com menos de 5 dias, o período não atende ao mínimo do fracionamento previsto na CLT (um período de pelo menos 14 dias e os demais de pelo menos 5).');
    var setor = norm($('#f-setor').value.trim());
    if (setor) {
      var conf = data.filter(function (r) { return r.id !== editingId && norm(r.setor || '') === setor && r.inicio <= b && r.fim >= a; });
      if (conf.length) hints.push('Mesmo setor no período: ' + conf.slice(0, 3).map(function (r) { return esc(r.nome) + ' (' + fmtS(r.inicio) + ' a ' + fmtS(r.fim) + ')'; }).join(', ') + (conf.length > 3 ? ' e mais ' + (conf.length - 3) : '') + '.');
    }
    $('#hints').innerHTML = hints.map(function (h) { return '<div class="hint">' + h + '</div>'; }).join('');
  }

  function openForm(id) {
    editingId = id || null;
    var r = id ? data.find(function (x) { return x.id === id; }) : null;
    $('#sheet-title').textContent = r ? 'Editar cadastro' : 'Novo cadastro';
    $('#f-nome').value = r ? r.nome : '';
    $('#f-mat').value = r ? (r.matricula || '') : '';
    $('#f-setor').value = r ? (r.setor || '') : '';
    setDate('f-ini', r ? r.inicio : '');
    setDate('f-fim', r ? r.fim : '');
    $('#f-obs').value = r ? (r.obs || '') : '';
    document.querySelector('input[name="status"][value="' + (r ? r.status : 'aprovada') + '"]').checked = true;
    ['nome', 'ini', 'fim'].forEach(function (k) { setErr(k, ''); });
    var del = $('#btn-del'); del.hidden = !r; del.classList.remove('sure'); del.textContent = 'Excluir cadastro';
    var setores = Array.from(new Set(data.map(function (x) { return x.setor; }).filter(Boolean)));
    $('#setores').innerHTML = setores.map(function (s) { return '<option value="' + esc(s) + '">'; }).join('');
    updateCalc();
    $('#sheet').hidden = false;
    $('#form').scrollTop = 0;
    try { history.pushState({ f: 1 }, ''); } catch (e) {}
    if (!r) setTimeout(function () { try { $('#f-nome').focus(); } catch (e) {} }, 60);
  }

  function closeForm(fromPop) {
    if ($('#sheet').hidden) return;
    $('#sheet').hidden = true;
    if (!fromPop) { try { if (history.state && history.state.f) history.back(); } catch (e) {} }
  }

  var toastTimer;
  function toast(msg) {
    var t = $('#toast'); t.textContent = msg; t.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.hidden = true; }, 2200);
  }

  function submitForm(ev) {
    ev.preventDefault();
    var nome = $('#f-nome').value.trim(), a = getDate('f-ini'), b = getDate('f-fim'), ok = true;
    setErr('nome', ''); setErr('ini', ''); setErr('fim', '');
    if (!nome) { setErr('nome', 'Informe o nome do colaborador.'); ok = false; }
    if (!a) { setErr('ini', $('#f-ini').value.trim() ? 'Data inválida. Use dd/mm/aaaa.' : 'Informe a data de início.'); ok = false; }
    if (!b) { setErr('fim', $('#f-fim').value.trim() ? 'Data inválida. Use dd/mm/aaaa.' : 'Informe a data final.'); ok = false; }
    else if (a && b < a) { setErr('fim', 'A data final não pode ser anterior ao início.'); ok = false; }
    if (!ok) { var bad = document.querySelector('.field.bad'); if (bad) bad.focus(); return; }
    var rec = {
      id: editingId || uid(), nome: nome, matricula: $('#f-mat').value.trim(), setor: $('#f-setor').value.trim(),
      inicio: a, fim: b, status: document.querySelector('input[name="status"]:checked').value, obs: $('#f-obs').value.trim()
    };
    var i = data.findIndex(function (x) { return x.id === rec.id; });
    if (i >= 0) data[i] = rec; else data.push(rec);
    save();
    closeForm();
    toast(i >= 0 ? 'Alterações salvas' : 'Cadastro salvo');
    renderScreen();
  }

  var delTimer;
  function askDelete() {
    var b = $('#btn-del');
    if (!b.classList.contains('sure')) {
      b.classList.add('sure'); b.textContent = 'Toque de novo para confirmar';
      clearTimeout(delTimer); delTimer = setTimeout(function () { b.classList.remove('sure'); b.textContent = 'Excluir cadastro'; }, 4000);
      return;
    }
    data = data.filter(function (r) { return r.id !== editingId; });
    save(); closeForm(); toast('Cadastro excluído'); renderScreen();
  }

  /* ---------- eventos ---------- */
  var touchX = null;
  var main = $('#main');
  main.addEventListener('click', function (e) {
    var t = e.target.closest('[data-edit],[data-approve],[data-day],[data-nav],[data-today],[data-clear],[data-gerar],[data-bk-pick],[data-bk-now],[data-share-json],[data-imp-go],[data-imp-cancel],[data-imp-undo]');
    if (!t) return;
    if (t.dataset.gerar) return gerarPdf();
    if (t.dataset.bkPick) return bkPick();
    if (t.dataset.bkNow) return bkNow(false);
    if (t.dataset.shareJson) return compartilharCopia();
    if (t.dataset.impGo) return impApply();
    if (t.dataset.impCancel) { imp = null; return renderOpt(); }
    if (t.dataset.impUndo) return impUndo();
    if (t.dataset.edit) return openForm(t.dataset.edit);
    if (t.dataset.approve) {
      var r = data.find(function (x) { return x.id === t.dataset.approve; });
      if (r) { r.status = 'aprovada'; save(); toast('Férias de ' + r.nome.split(' ')[0] + ' aprovadas'); renderScreen(); }
      return;
    }
    if (t.dataset.day) { selected = selected === t.dataset.day ? null : t.dataset.day; return resultsCal(); }
    if (t.dataset.nav) {
      view.m += Number(t.dataset.nav);
      if (view.m < 0) { view.m = 11; view.y--; } else if (view.m > 11) { view.m = 0; view.y++; }
      selected = null; return resultsCal();
    }
    if (t.dataset.today) { var n = new Date(); view = { y: n.getFullYear(), m: n.getMonth() }; selected = todayISO(); return resultsCal(); }
    if (t.dataset.clear) { filter = { q: '', setor: '', status: '' }; renderScreen(); }
  });
  main.addEventListener('input', function (e) { if (e.target.id === 'q') { filter.q = e.target.value; renderResults(); } });
  main.addEventListener('change', function (e) {
    if (e.target.id === 'fsetor') { filter.setor = e.target.value; renderResults(); }
    if (e.target.id === 'fstatus') { filter.status = e.target.value; renderResults(); }
    if (e.target.name === 'escopo') { exp.escopo = e.target.value; $('#xper').hidden = exp.escopo !== 'periodo'; renderExpRes(); }
    if (e.target.id === 'xsetor') { exp.setor = e.target.value; renderExpRes(); }
    if (e.target.id === 'bk-on') bkToggle(e.target.checked);
    if (e.target.id === 'bk-freq') bkFreq(Number(e.target.value));
    if (e.target.id === 'imp-file' && e.target.files && e.target.files[0]) impRead(e.target.files[0]);
    if (e.target.name === 'impmode' && imp) { imp.modo = e.target.value; renderOpt(); }
  });
  main.addEventListener('touchstart', function (e) { touchX = e.target.closest('.cal') ? e.touches[0].clientX : null; }, { passive: true });
  main.addEventListener('touchend', function (e) {
    if (touchX === null) return;
    var dx = e.changedTouches[0].clientX - touchX; touchX = null;
    if (Math.abs(dx) > 70) { var b = document.querySelector('[data-nav="' + (dx < 0 ? 1 : -1) + '"]'); if (b) b.click(); }
  }, { passive: true });

  document.querySelectorAll('nav button').forEach(function (b) { b.addEventListener('click', function () { go(b.dataset.tab); }); });
  $('#fab').addEventListener('click', function () { openForm(null); });
  $('#sheet-close').addEventListener('click', function () { closeForm(); });
  $('#form').addEventListener('submit', submitForm);
  $('#btn-del').addEventListener('click', askDelete);
  ['#f-ini', '#f-fim', '#f-setor'].forEach(function (s) { $(s).addEventListener('input', function () { setErr('ini', ''); setErr('fim', ''); updateCalc(); }); });
  $('#f-nome').addEventListener('input', function () { setErr('nome', ''); });
  pkBind();
  window.addEventListener('popstate', function () {
    if (!$('#pk').hidden) { pkClose(); try { history.pushState({ f: 1 }, ''); } catch (e) {} return; }
    closeForm(true);
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { if (!$('#pk').hidden) pkClose(); else closeForm(); } });

  /* ---------- início ---------- */
  var saved = load();
  data = saved || (DEMO ? seed() : []);
  if (DEMO) {
    $('#demo').hidden = false;
    $('#demo-reset').addEventListener('click', function () { data = seed(); save(); filter = { q: '', setor: '', status: '' }; renderScreen(); toast('Exemplos restaurados'); });
  }
  renderScreen();
  syncNative();
  catchUp();
  document.addEventListener('visibilitychange', function () { if (!document.hidden) catchUp(); });
})();
</script>
